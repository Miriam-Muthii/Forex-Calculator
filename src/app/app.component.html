<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
  </head>
  <body>
    <main>
      <h1>Currency Converter</h1>
      <div class="controls" id="controls">
        <div class="control">
          <button id="base" data-drawer (click)="showDrawer($event)">{{ state.base }}</button>
          <input type="number" id="base-input" value="0" min="0" step="0.01" (input)="convertInput($event)" />
        </div>
        <div class="control">
          <button id="target" data-drawer (click)="showDrawer($event)">{{ state.target }}</button>
          <input type="number" id="target-input" value="0" readonly />
        </div>
        <button class="swap-btn" id="swap-btn" (click)="switchPair()">
          <span class="material-symbols-outlined"> sync_alt </span>
        </button>
      </div>
      <div class="exchange-rate">
        <h5>Exchange Rate</h5>
        <span id="exchange-rate">{{ exchangeRateDisplay }}</span>
      </div>
      <div class="drawer" id="drawer">
        <div class="title">
          <button id="dismiss-btn" (click)="hideDrawer()">
            <span class="material-symbols-outlined"> west </span>
          </button>
          <h3>Select Currency</h3>
        </div>
        <div class="search">
          <input type="search" id="search" placeholder="Search" (input)="filterCurrency($event)" />
        </div>
        <ul class="currency-list" id="currency-list">
          <li *ngFor="let currency of state.filteredCurrencies" (click)="selectPair($event)" [attr.data-code]="currency.code">
            <img src="https://placehold.co/48" alt="" />
            <div>
              <h4>{{ currency.code }}</h4>
              <p>{{ currency.name }}</p>
            </div>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
